apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ride-share
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ride-share/api-gateway:dev-3
          imagePullPolicy: Never
          env:
            - name: TRIP_GRPC_TARGET
              value: "dns:///trip-service:50051"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
