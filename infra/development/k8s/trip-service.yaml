apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: ride-share
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      containers:
        - name: trip-service
          image: ride-share/trip-service:dev-1
          imagePullPolicy: Never
          env:
            - name: TRIP_GRPC_ADDR
              value: ":50051"
          ports:
            - name: grpc
              containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trip-service
  namespace: ride-share
spec:
  type: ClusterIP
  selector:
    app: trip-service
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
